<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Peachi Viewer</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #120c1c; color: #f3e9f7; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; z-index: 2; }
    #ui div { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button { font: inherit; padding: 4px 10px; border: 1px solid #6d4a78; border-radius: 4px; background: #1e1426; color: #f3e9f7; cursor: pointer; }
    button.on { background: #f3e9f7; color: #1e1426; border-color: #f3e9f7; }
    #info { opacity: 0.6; }
    body.light { background: #fff; color: #222; }
    body.light button { background: #fff; color: #333; border-color: #bbb; }
    body.light button.on { background: #333; color: #fff; }
  </style>
</head>
<body>
  <div id="ui">
    <div id="expr"></div>
    <div id="pose"></div>
    <div><button id="ghost">ghost</button><button id="spin">spin</button><button id="lights">game light</button>
      <label>glow <input id="glow" type="range" min="0" max="1" step="0.05" value="0"></label></div>
    <div id="info"></div>
  </div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { buildPeachi, buildHeadphonesItem } from './js/peachi/model.js';
    import { EXPRESSIONS } from './js/peachi/face.js';
    import { POSES } from './js/peachi/anim.js';

    // URL params: ?angle=90&expr=angry&pose=reach&ghost=0&glow=0.5&zoom=face|upper|legs|feet&bg=white&light=game&keyaz=60&ui=0&item=0&hide=hair,outline
    const q = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);
    if (q.get('ui') === '0') document.getElementById('ui').hidden = true;

    const white = q.get('bg') === 'white';
    if (white) document.body.classList.add('light');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(white ? 0xffffff : 0x120c1c);

    // studio: soft sheet-like light · game: dark room, purple fog, flashlight from the camera
    const studio = new THREE.Group();
    studio.add(new THREE.HemisphereLight(0xffffff, 0xd8cce6, 0.18));
    const key = new THREE.DirectionalLight(0xffffff, Math.PI); key.position.set(0.9, 2.4, 3.0); studio.add(key);
    if (q.has('keyaz')) { const a = THREE.MathUtils.degToRad(Number(q.get('keyaz'))); key.position.set(Math.sin(a) * 3, 1.6, Math.cos(a) * 3); } // light angle around her
    const game = new THREE.Group();
    game.add(new THREE.HemisphereLight(0x3a2a5a, 0x0a0610, 0.5));
    const rgb = new THREE.PointLight(0xff5fa8, 4, 6); rgb.position.set(-1.4, 1.6, -0.8); game.add(rgb);
    const torch = new THREE.SpotLight(0xfff1dc, 26, 14, 0.42, 0.45, 1.4);
    game.add(torch); game.add(torch.target);
    let gameLight = q.get('light') === 'game';
    scene.add(studio, game);
    function applyLights() {
      studio.visible = !gameLight; game.visible = gameLight;
      scene.fog = gameLight ? new THREE.FogExp2(0x1a0b2e, 0.06) : null;
      if (!white) scene.background.set(gameLight ? 0x07040c : 0x120c1c);
    }
    applyLights();
    const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshStandardMaterial({ color: white ? 0xeeeaf2 : 0x241634, roughness: 0.9 }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);

    const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
    const controls = new OrbitControls(camera, renderer.domElement);
    const VIEWS = {
      body: [[0, 0.86, 3.35], [0, 0.82, 0]],
      face: [[0, 1.45, 0.62], [0, 1.44, 0]],
      upper: [[0, 1.2, 1.55], [0, 1.16, 0]],
      legs: [[0, 0.5, 1.9], [0, 0.45, 0]],
      feet: [[0, 0.2, 0.9], [0, 0.1, 0]],
    };
    const [cp, ct] = VIEWS[q.get('zoom')] || VIEWS.body;
    camera.position.set(...cp); controls.target.set(...ct);
    controls.update();

    let ghost = q.get('ghost') !== '0';
    let spin = !q.has('angle');
    let expr = q.get('expr') || 'happy', pose = q.get('pose') || 'idle', glow = Number(q.get('glow') || 0);
    let peachi;
    function rebuild() {
      const rotY = peachi ? peachi.group.rotation.y : THREE.MathUtils.degToRad(Number(q.get('angle') || 0));
      if (peachi) { scene.remove(peachi.group); peachi.dispose(); }
      peachi = buildPeachi({ ghost });
      peachi.group.rotation.y = rotY;
      peachi.setExpression(expr); peachi.setPose(pose); peachi.setGlow(glow);
      const hide = (q.get('hide') || '').split(',').filter(Boolean); // debug: ?hide=hair,outline
      if (hide.length) peachi.group.traverse((o) => { if (o.isMesh && hide.includes(o.name)) o.visible = false; });
      scene.add(peachi.group);
      refresh();
    }

    const item = buildHeadphonesItem();
    item.position.set(0.75, 0, 0.2);
    if (q.get('item') !== '0') scene.add(item);

    const $ = (id) => document.getElementById(id);
    function buttons(el, names, onClick) {
      for (const n of names) { const b = document.createElement('button'); b.textContent = n; b.dataset.n = n; b.onclick = () => { onClick(n); refresh(); }; el.appendChild(b); }
    }
    buttons($('expr'), EXPRESSIONS, (n) => { expr = n; peachi.setExpression(n); });
    buttons($('pose'), POSES, (n) => { pose = n; peachi.setPose(n); });
    $('ghost').onclick = () => { ghost = !ghost; rebuild(); };
    $('spin').onclick = () => { spin = !spin; refresh(); };
    $('lights').onclick = () => { gameLight = !gameLight; applyLights(); refresh(); };
    $('glow').value = glow;
    $('glow').oninput = (e) => { glow = Number(e.target.value); peachi.setGlow(glow); };
    function refresh() {
      document.querySelectorAll('#expr button').forEach((b) => b.classList.toggle('on', b.dataset.n === expr));
      document.querySelectorAll('#pose button').forEach((b) => b.classList.toggle('on', b.dataset.n === pose));
      $('ghost').classList.toggle('on', ghost); $('spin').classList.toggle('on', spin); $('lights').classList.toggle('on', gameLight);
      let tris = 0, calls = 0;
      peachi.group.traverse((o) => { if (o.isMesh) { calls++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
      $('info').textContent = `${Math.round(tris)} tris (incl. outlines) · ${calls} meshes · drag to orbit`;
    }
    rebuild();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const dt = Math.min(clock.getDelta(), 0.1), t = clock.elapsedTime;
      if (spin) peachi.group.rotation.y += dt * 0.5;
      peachi.update(dt, t);
      item.userData.update(dt, t);
      controls.update();
      torch.position.copy(camera.position);
      torch.target.position.copy(controls.target);
      renderer.render(scene, camera);
    });
    window.__peachi = () => peachi;
  </script>
</body>
</html>
