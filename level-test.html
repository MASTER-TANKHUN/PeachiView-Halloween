<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Level test</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Mitr:wght@400;600&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
  <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#info{position:fixed;left:8px;top:8px;color:#fff;font:12px monospace;white-space:pre}</style>
</head>
<body>
<div id="info"></div>
<script type="module">
// Throwaway test page for js/level.js + js/player.js
// ?view=top  top-down layout | ?x=&z=&yaw=&pitch= override camera | ?flicker=1
import * as THREE from 'three';
import { buildLevel } from './js/level.js';
import { Player } from './js/player.js';

const q = new URLSearchParams(location.search);
const info = document.getElementById('info');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 120);
const level = buildLevel(scene);
const player = new Player(camera, renderer.domElement, level);
if (!camera.parent) scene.add(camera);

// ---- assertions (console.error on failure so smoke.mjs reports them)
const fail = (m) => console.error('ASSERT: ' + m);
if (level.itemSpots.length < 6) fail('itemSpots < 6');
if (level.ghostSpawns.length < 3) fail('ghostSpawns < 3');
if (level.navPoints.length < 10) fail('navPoints < 10');
for (const p of [...level.navPoints, level.spawn.position]) {
  const c = p.clone(); level.collide(c, 0.3);
  if (c.distanceTo(p) > 1e-6) fail('nav/spawn point inside collider ' + p.toArray());
}
for (const p of level.itemSpots) { // some free standing spot within 1.2 m
  let ok = false;
  for (let a = 0; a < 16 && !ok; a++) for (const r of [0.6, 0.9, 1.2]) {
    const c = new THREE.Vector3(p.x + Math.cos(a / 16 * 6.283) * r, 0, p.z + Math.sin(a / 16 * 6.283) * r);
    const c2 = c.clone(); level.collide(c2, 0.3);
    if (c2.distanceTo(c) < 1e-6 && Math.abs(c.x) < 9.9 && Math.abs(c.z) < 6.9) { ok = true; break; }
  }
  if (!ok) fail('item spot unreachable ' + p.toArray());
}
const key = (code, type = 'keydown') => window.dispatchEvent(new KeyboardEvent(type, { code }));
// walk test: face +z from spawn, hold W 5 s -> blocked by hallway wall (z ~ -1.4)
player.position.copy(level.spawn.position); player.yaw = Math.PI;
key('KeyW'); for (let i = 0; i < 300; i++) player.update(1 / 60); key('KeyW', 'keyup');
if (player.position.z > -1.35 || player.position.z < -1.5) fail('wall collision z=' + player.position.z.toFixed(3));
// walk out through the stream door into the hallway
let steps = 0; player.onStep = () => steps++;
player.position.set(-4, 0, -2.5); player.yaw = Math.PI;
key('KeyW'); key('ShiftLeft'); for (let i = 0; i < 90; i++) player.update(1 / 60); key('KeyW', 'keyup'); key('ShiftLeft', 'keyup');
if (player.position.z < 0) fail('could not pass stream door z=' + player.position.z.toFixed(3));
if (steps < 3) fail('onStep not firing: ' + steps);
for (let i = 0; i < 30; i++) player.update(1 / 60);
// flashlight + isLightOn
player.position.copy(level.spawn.position); player.yaw = 0; player.pitch = 0; player.update(1 / 60);
player.flashlight.on = true;
const eye = new THREE.Vector3(-6, 1.6, -3.3);
if (!player.isLightOn(eye.clone().add(new THREE.Vector3(0, -0.6, -3)))) fail('isLightOn ahead');
if (player.isLightOn(eye.clone().add(new THREE.Vector3(0, 0, 3)))) fail('isLightOn behind');
if (player.isLightOn(eye.clone().add(new THREE.Vector3(0, 0, -13)))) fail('isLightOn too far');
if (player.isLightOn(eye.clone().add(new THREE.Vector3(3, 0, -3)))) fail('isLightOn outside cone');
// interactables
let prompt = 'unset', used = 0;
player.onPrompt = (l) => { prompt = l; };
const h = player.addInteractable({ position: new THREE.Vector3(-6, 1.0, -4.3), radius: 1.5, label: 'test', onUse: () => used++ });
player.update(1 / 60);
if (prompt !== 'test') fail('prompt not shown: ' + prompt);
key('KeyE'); key('KeyE', 'keyup');
if (used !== 1) fail('onUse not called');
player.yaw = Math.PI; player.update(1 / 60);
if (prompt !== null) fail('prompt should clear when looking away');
h.remove(); player.yaw = 0;
// battery drain 10 s
for (let i = 0; i < 600; i++) player.update(1 / 60);
const exp = 100 - 10 * 100 / 240;
if (Math.abs(player.flashlight.battery - exp) > 0.2) fail('battery drain ' + player.flashlight.battery.toFixed(2));
player.flashlight.battery = 0.01; player.update(0.05);
if (player.flashlight.on) fail('flashlight should die at 0');
player.flashlight.battery = 100; player.flashlight.on = true;
// enabled=false ignores input
player.enabled = false; key('KeyW'); const z0 = player.position.z; for (let i = 0; i < 30; i++) player.update(1 / 60);
if (player.position.z !== z0) fail('moved while disabled'); key('KeyW', 'keyup'); player.enabled = true;

// ---- view setup
player.position.copy(level.spawn.position); player.yaw = level.spawn.yaw; player.pitch = -0.05;
if (q.has('x')) player.position.set(+q.get('x'), 0, +q.get('z'));
if (q.has('yaw')) player.yaw = +q.get('yaw');
if (q.has('pitch')) player.pitch = +q.get('pitch');
if (q.get('flicker') === '1') level.setFlicker(true);
const top = q.get('view') === 'top';
let topCam;
if (top) {
  level.root.getObjectByName('ceiling').visible = false;
  scene.fog = null;
  scene.add(new THREE.AmbientLight(0xffffff, 2.5));
  topCam = new THREE.OrthographicCamera(-11 * innerWidth / innerHeight, 11 * innerWidth / innerHeight, 11, -11, 0.1, 100);
  topCam.position.set(0, 50, 0); topCam.up.set(0, 0, -1); topCam.lookAt(0, 0, 0);
  // mark gameplay points
  const mk = (arr, color, s) => arr.forEach((p) => { const m = new THREE.Mesh(new THREE.SphereGeometry(s), new THREE.MeshBasicMaterial({ color })); m.position.copy(p).setY(3); scene.add(m); });
  mk(level.itemSpots, 0x00ff00, 0.2); mk(level.ghostSpawns, 0xff0000, 0.25); mk(level.navPoints, 0x00aaff, 0.12); mk([level.spawn.position, level.deskPosition], 0xffff00, 0.3);
}
addEventListener('click', () => player.lock());

const clock = new THREE.Clock();
let t = 0, frames = 0;
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05); t += dt; frames++;
  level.update(dt, t);
  player.update(dt);
  renderer.render(scene, top ? topCam : camera);
  info.textContent = `frames ${frames}  calls ${renderer.info.render.calls}  tris ${renderer.info.render.triangles}  battery ${player.flashlight.battery.toFixed(1)}  pos ${player.position.x.toFixed(2)},${player.position.z.toFixed(2)}  room ${level.roomAt(player.position)}`;
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
